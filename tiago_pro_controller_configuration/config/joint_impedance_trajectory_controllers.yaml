arm_left_impedance_controller:
  type: "impedance_controllers/JointTrajectoryController"
  joints:
    - arm_left_1_joint
    - arm_left_2_joint
    - arm_left_3_joint
    - arm_left_4_joint
    - arm_left_5_joint
    - arm_left_6_joint
    - arm_left_7_joint
  robot_model_chains: ["base_gripper_left_link"]
  impedance_gains:
    arm_left_1_joint: {kp: -2.5, kd: 0.0}
    arm_left_2_joint: {kp: -8.0, kd: 0.0}
    arm_left_3_joint: {kp: -2.5, kd: 0.0}
    arm_left_4_joint: {kp: -6.0, kd: 0.0}
    arm_left_5_joint: {kp: -2.0, kd: 0.0}
    arm_left_6_joint: {kp: -3.0, kd: -0.25}
    arm_left_7_joint: {kp: -2.0, kd: 0.0}
  motor_params:
    arm_left_1_joint: {motor_torque_constant: -0.103, reduction_ratio: 101.0}
    arm_left_2_joint: {motor_torque_constant: -0.085, reduction_ratio: 121.0}
    arm_left_3_joint: {motor_torque_constant: -0.042, reduction_ratio: 101.0}
    arm_left_4_joint: {motor_torque_constant: -0.032, reduction_ratio: 101.0}
    arm_left_5_joint: {motor_torque_constant: -1.2, reduction_ratio: 101.0}
    arm_left_6_joint: {motor_torque_constant: -0.03, reduction_ratio: 101.1}
    arm_left_7_joint: {motor_torque_constant: 0.103, reduction_ratio: 101.1}
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 5.0
    arm_left_1_joint:
      goal: 0.02
    arm_left_2_joint:
      goal: 0.02
    arm_left_3_joint:
      goal: 0.02
    arm_left_4_joint:
      goal: 0.02
    arm_left_5_joint:
      goal: 0.02
    arm_left_6_joint:
      goal: 0.02
    arm_left_7_joint:
      goal: 0.02
