${ARM_SIDE_PREFIX}_cartesian_vel_controller_ee_frame:
  ros__parameters:
    type: tsid_controllers/CartesianVelocityController
    
    joint_state_names:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
      - torso_lift_joint
      - head_1_joint
      - head_2_joint

    joint_command_names:
      - ${ARM_SIDE_PREFIX}_1_joint
      - ${ARM_SIDE_PREFIX}_2_joint
      - ${ARM_SIDE_PREFIX}_3_joint
      - ${ARM_SIDE_PREFIX}_4_joint
      - ${ARM_SIDE_PREFIX}_5_joint
      - ${ARM_SIDE_PREFIX}_6_joint
      - ${ARM_SIDE_PREFIX}_7_joint

    interface_name: position

    ee_names:
      - ${EE_PREFIX}_${SIDE}_${EE_SUFFIX}

    velocity_scaling: 1.0 
    acceleration_scaling: 0.05

    local_frame: true
    enable_limit_stop: true
    enable_bounding_box: true
    enable_collision_avoidance: false
    stop_on_ee_collision: true

    posture_gain: 1.0
    manipulation_cube:
      ${EE_PREFIX}_right_${EE_SUFFIX}:      
        x_min: -0.2
        x_max: 0.7
        y_min: -0.75
        y_max: 0.22
        z_min: 0.0
        z_max: 1.4
      ${EE_PREFIX}_left_${EE_SUFFIX}:      
        x_min: -0.2
        x_max: 0.7
        y_min: -0.22 
        y_max: 0.75   
        z_min: 0.0
        z_max: 1.4




